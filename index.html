<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#202124">
<title>ペンらくがき</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <symbol id="icon-more" viewBox="0 0 24 24">
    <g fill="#e8eaed"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></g>
  </symbol>
  <symbol id="icon-erase" viewBox="0 0 24 24">
    <g transform="rotate(-45 12 12)">
      <rect x="2.5" y="7.5" width="19" height="9" rx="2" fill="#f48fb1"/>
      <rect x="2.5" y="7.5" width="7" height="9" rx="2" fill="#eceff1"/>
      <rect x="7.5" y="7.5" width="2" height="9" fill="#eceff1"/>
    </g>
    <path d="M4 21.5h16" stroke="#9aa0a6" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>
  <symbol id="icon-paste" viewBox="0 0 24 24">
    <rect x="4.5" y="4" width="15" height="18" rx="2" fill="#c58b4d"/>
    <rect x="6.5" y="7" width="11" height="13" rx="1" fill="#ffffff"/>
    <rect x="8.5" y="2.5" width="7" height="3.5" rx="1" fill="#9aa0a6"/>
    <path d="M9 11h6M9 14h6M9 17h4" stroke="#9aa0a6" stroke-width="1.3"/>
  </symbol>
  <symbol id="icon-select" viewBox="0 0 24 24">
    <rect x="4" y="4" width="16" height="16" rx="1" fill="none" stroke="#e8eaed" stroke-width="2" stroke-dasharray="3.5 2.5"/>
  </symbol>
</svg>
<canvas id="board"></canvas>
<div id="empty">
  <div id="intro">
    <img src="icon-192.png" alt="" width="96" height="96">
    <h1>ペンらくがき</h1>
    <p>共有で受け取った画像に、<br>拡大しながらペンで書き込み、<br>共有で送り返す</p>
    <button id="install" hidden>📲 インストールする</button>
    <p id="install-note">Chrome で開き、メニュー（⋮）の<br>「アプリをインストール」から入れてください</p>
  </div>
  <p id="hint">共有メニューの「ペンらくがき」で画像を送るか、<br>下の ⋯ の「貼る」「白紙」から始めてください</p>
</div>

<div id="panel" hidden>
  <div class="row" id="tools">
    <button data-tool="pen" aria-label="ペン">✒️</button>
    <button data-tool="marker" aria-label="マーカー">🖍️</button>
  </div>
  <div class="row" id="colors">
    <button data-color="#e53935" aria-label="赤"></button>
    <button data-color="#1e63d6" aria-label="青"></button>
    <button data-color="#212121" aria-label="黒"></button>
    <button data-color="#fdd835" aria-label="黄"></button>
    <button data-color="#43a047" aria-label="緑"></button>
    <button data-color="#ffffff" aria-label="白"></button>
  </div>
  <div class="row" id="widths">
    <button data-width="2" aria-label="細い"><i></i></button>
    <button data-width="4" aria-label="ふつう"><i></i></button>
    <button data-width="8" aria-label="太い"><i></i></button>
    <button data-width="16" aria-label="とても太い"><i></i></button>
  </div>
</div>

<div id="subpanel" hidden>
  <div class="row">
    <button data-mode="erase"><svg width="24" height="24" aria-hidden="true"><use href="#icon-erase"/></svg>消しゴム</button>
    <button data-mode="select"><svg width="24" height="24" aria-hidden="true"><use href="#icon-select"/></svg>範囲</button>
    <button id="paste"><svg width="24" height="24" aria-hidden="true"><use href="#icon-paste"/></svg>貼る</button>
    <button id="clear"><span aria-hidden="true">📄</span>白紙</button>
    <button id="fit" disabled><span aria-hidden="true">⤢</span>全体表示</button>
  </div>
</div>

<div id="selected" hidden>
  <button id="copy">コピー</button>
  <button id="cut">切り取り</button>
  <button id="unselect">やめる</button>
</div>

<div id="placing" hidden>
  <button id="place">決定</button>
  <button id="unplace">やめる</button>
</div>

<div id="toast" hidden></div>

<div id="bar">
  <button id="pen" aria-label="ペン"><span id="pen-tool">✒️</span><i id="pen-dot"></i></button>
  <button id="more" aria-label="消しゴム・範囲・貼る・白紙・全体表示"><svg width="26" height="26" aria-hidden="true"><use id="more-icon" href="#icon-more"/></svg></button>
  <button id="undo" aria-label="元に戻す" disabled>↶</button>
  <button id="share" aria-label="送る" disabled>送る</button>
</div>

<script src="app.js"></script>
</body>
</html>
